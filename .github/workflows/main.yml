name: Flutter Build & Release

# This workflow triggers when a new tag starting with 'v' is pushed (e.g., v1.0.0)
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout the code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Java environment for Android build
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Set up Flutter environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # You can specify a version or leave it to 'stable'
          # flutter-version: '3.19.0'

      # 4. Install dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 5. Run code generation (for Riverpod, Freezed, etc.)
      - name: Run Build Runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # 6. Build Android APK
      - name: Build APK
        run: flutter build apk --release

      # 7. Build Android App Bundle (AAB) for Play Store
      - name: Build App Bundle
        run: flutter build appbundle --release

      # 8. Create GitHub Release and upload artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
