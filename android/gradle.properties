org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8
android.useAndroidX=true
# Jetifier is only needed for legacy com.android.support artifacts. None of the
# plugins used here ship them, and it is deprecated as of AGP 8, so it is off.
android.enableJetifier=false
# AGP warns when compileSdk is newer than the version it was tested against.
android.suppressUnsupportedCompileSdk=36
