allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

subprojects {
    project.plugins.configureEach {
        if (it.class.name.contains('com.android.build.gradle.LibraryPlugin') || 
            it.class.name.contains('com.android.build.gradle.AppPlugin')) {
            project.android {
                compileSdk 36
                defaultConfig {
                    targetSdk 36
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
