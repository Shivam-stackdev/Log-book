plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.example.army_mess_inventory"
    // Several plugins (camera_android_camerax, image_picker_android,
    // shared_preferences_android, sqflite_android, flutter_plugin_android_lifecycle)
    // require a modern compileSdk. Keep this in sync with `sharedCompileSdk`
    // declared in android/build.gradle.
    compileSdk rootProject.ext.sharedCompileSdk
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.example.army_mess_inventory"
        // Plugin manifests declare minSdkVersion 24, so the app cannot stay on
        // 21/23 (manifest merger would fail). Kept in sync with `sharedMinSdk`.
        minSdk rootProject.ext.sharedMinSdk
        targetSdk rootProject.ext.sharedTargetSdk
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            // Flutter enables R8 for release builds; these rules keep it from
            // failing on the optional ML Kit language models that are not
            // bundled (only TextRecognitionScript.latin is used).
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
}
