name: army_mess_inventory
description: A production-ready inventory management system for daily mesh operations.
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: ">=3.19.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: any

  # Navigation
  go_router: any

  # Local Database
  sqflite: any
  path_provider: any
  path: any

  # Utilities
  intl: any
  dartz: any
  equatable: any
  uuid: any
  collection: any

  # PDF Generation & Printing
  pdf: any
  printing: any

  # File Sharing
  share_plus: any
  cross_file: any

  # OCR & Media
  image_picker: any
  google_mlkit_text_recognition: any
  camera: any

  # Persistence
  shared_preferences: any

  # HTTP
  http: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
