name: army_mess_inventory
description: A production-ready inventory management system for daily mesh operations.
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: ">=3.19.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.0.0

  # Local Database
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0

  # Utilities
  intl: ^0.19.0
  dartz: ^0.10.1
  equatable: ^2.0.5
  uuid: ^4.4.0
  collection: ^1.18.0

  # PDF Generation & Printing
  pdf: ^3.11.0
  printing: ^5.12.0

  # File Sharing
  share_plus: ^9.0.0
  cross_file: ^0.3.4+2

  # OCR & Media
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0
  camera: ^0.11.0+1

  # Persistence
  shared_preferences: ^2.3.0

  # HTTP
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
