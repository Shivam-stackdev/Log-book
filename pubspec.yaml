name: army_mess_inventory
description: A production-ready Army Mess Inventory Management application.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Navigation
  go_router: ^13.2.0
  
  # Local Database
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.9.0
  
  # UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.0
  flutter_animate: ^4.5.0
  
  # Utilities
  intl: ^0.19.0
  dartz: ^0.10.1
  uuid: ^4.4.0
  
  # PDF & Printing
  pdf: ^3.10.8
  printing: ^5.11.1
  share_plus: ^9.0.0
  
  # OCR & Media
  image_picker: ^1.1.0
  google_mlkit_text_recognition: ^0.12.0
  camera: ^0.11.0+1
  
  # Persistence & Storage
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Code Generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  freezed_annotation: ^2.4.1
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
